[package]
name = "restic-gtk"
version = "0.1.0"
edition = "2024"
description = "GTK4/libadwaita browser for multiple restic repositories"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
rustic_core = "0.13"
rustic_backend = { version = "0.7", default-features = false, features = ["rest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
async-channel = "2"
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
glib-build-tools = "0.22"

# Unoptimized key derivation (scrypt) takes ~10 s per unlock; optimize dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2
