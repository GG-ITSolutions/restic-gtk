[package]
name = "restic-gtk"
version = "0.1.0"
edition = "2024"
description = "GTK4/libadwaita browser for multiple restic repositories"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
rustic_core = "0.13"
rustic_backend = { version = "0.7", default-features = false, features = ["rest", "opendal"] }
# Only to recognize backend errors in rustic's error chain; same version as rustic_backend.
opendal = { version = "0.58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
async-channel = "2"
thiserror = "2"
dirs = "6"
# Disk images in snapshots: partition tables, filesystems (NTFS, FAT, ext2/3/4), LVM2 and
# Windows file compression.
gptman = "3"
mbrman = "0.6"
ntfs = "0.4"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
lznt1 = "0.1"
xpress-huffman = "0.1"
ext4-view = { version = "1", features = ["std"] }
lamlvm = "0.1.3"
embedded-io = { version = "0.6", features = ["std"] }
# Container formats of disk images: compressed qcow2 clusters and VMDK grains.
miniz_oxide = "0.9"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
ruzstd = "0.8"

[build-dependencies]
glib-build-tools = "0.22"

# Unoptimized key derivation (scrypt) takes ~10 s per unlock; optimize dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2
